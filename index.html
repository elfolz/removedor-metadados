<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
	<meta name="description" content="Remova metadados indesejados de IA de suas imagens">
	<link rel="icon" type="image/png" href="./img/favicon.png">
	<link rel="manifest" href="./manifest.json">
	<link rel="preload" as="style" href="./stylesheet.css" onload="this.rel='stylesheet'">
	<meta property="og:url" content="https://elfolz.github.io/removedor-metadados" />
	<meta property="og:title" content="Removedor de metadados de IA">
	<meta property="og:image" content="https://elfolz.github.io/removedor-metadados/img/512x512.png">
	<meta property="og:image:type" content="image/png" />
	<meta property="og:image:width" content="512" />
	<meta property="og:image:height" content="512" />
	<meta property="og:description" content="Remova metadados indesejados de IA de suas imagens">
	<meta name="robots" content="notranslate">
	<meta name="google" value="notranslate">
	<title>Removedor de metadados de IA</title>
</head>

<body>
	<main class="card">
		<div class="card-header">
			<h1 class="card-title">Removedor de metadados de IA</h1>
			<p class="card-subtitle">Tudo roda no seu navegador. Nada é enviado para nenhum servidor.</p>
		</div>
		<img id="preview" class="preview" alt="" hidden>
		<div class="card-content">
			<input type="file" id="file" accept="image/jpeg,image/png,image/webp">
			<pre id="meta">Escolha uma imagem para inspecionar</pre>
		</div>
		<div class="card-actions">
			<button id="clean" disabled>Remover metadados e baixar imagem</button>
			<p id="status" class="muted"></p>
		</div>
	</main>

	<script>
		/* ---------- 1. READ METADATA ---------- */

		const TAGS = {
			0x010f: 'Make', 0x0110: 'Model', 0x0112: 'Orientation', 0x0131: 'Software',
			0x0132: 'DateTime', 0x013b: 'Artist', 0x8298: 'Copyright', 0x010e: 'ImageDescription',
			0x829a: 'ExposureTime', 0x829d: 'FNumber', 0x8827: 'ISO', 0x9003: 'DateTimeOriginal',
			0x920a: 'FocalLength', 0xa434: 'LensModel', 0xa002: 'PixelXDimension', 0xa003: 'PixelYDimension',
			0x8769: 'ExifIFD', 0x8825: 'GPSIFD',
			// GPS (inside GPS IFD)
			0x0001: 'GPSLatitudeRef', 0x0002: 'GPSLatitude', 0x0003: 'GPSLongitudeRef', 0x0004: 'GPSLongitude',
			0x0006: 'GPSAltitude'
		}

		function readExif(view, start) {
			// `start` points at the "Exif\0\0" header
			const tiff = start + 6
			const little = view.getUint16(tiff) === 0x4949
			const u16 = o => view.getUint16(o, little)
			const u32 = o => view.getUint32(o, little)
			const sizes = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 }
			const out = {}

			function value(type, count, valOff) {
				const size = (sizes[type] || 1) * count
				const off = size > 4 ? tiff + u32(valOff) : valOff
				if (type === 2) {
					let s = ''
					for (let i = 0; i < count - 1; i++) s += String.fromCharCode(view.getUint8(off + i))
					return s.trim()
				}
				const vals = []
				for (let i = 0; i < Math.min(count, 8); i++) {
					if (type === 3) vals.push(u16(off + i * 2))
					else if (type === 4) vals.push(u32(off + i * 4))
					else if (type === 5) vals.push(+(u32(off + i * 8) / (u32(off + i * 8 + 4) || 1)).toFixed(5))
					else if (type === 1 || type === 7) vals.push(view.getUint8(off + i))
				}
				return count === 1 ? vals[0] : vals
			}

			function ifd(offset, prefix) {
				if (offset + 2 > view.byteLength) return
				const n = u16(offset)
				for (let i = 0; i < n; i++) {
					const e = offset + 2 + i * 12
					if (e + 12 > view.byteLength) break
					const tag = u16(e), type = u16(e + 2), count = u32(e + 4)
					if (tag === 0x8769 || tag === 0x8825) {
						ifd(tiff + u32(e + 8), tag === 0x8825 ? 'GPS.' : '')
						continue
					}
					const name = TAGS[tag] || ('Tag 0x' + tag.toString(16))
					try { out[prefix + name] = value(type, count, e + 8) } catch { }
				}
			}
			ifd(tiff + u32(tiff + 4), '')
			return out
		}

		function readJpeg(buf) {
			const view = new DataView(buf)
			const found = {}
			let o = 2
			while (o + 4 < view.byteLength) {
				if (view.getUint8(o) !== 0xff) break
				const marker = view.getUint8(o + 1)
				if (marker === 0xda) break // start of scan
				const len = view.getUint16(o + 2)
				const head = String.fromCharCode(...new Uint8Array(buf, o + 4, Math.min(30, len - 2)))
				if (marker === 0xe1 && head.startsWith('Exif')) found.EXIF = readExif(view, o + 4)
				else if (marker === 0xe1 && head.includes('xmp')) found.XMP = `present (${len} bytes)`
				else if (marker === 0xe2 && head.startsWith('ICC_PROFILE')) found.ICC_Profile = `present (${len} bytes)`
				else if (marker === 0xed) found.IPTC_Photoshop = `present (${len} bytes)`
				else if (marker === 0xeb) found.C2PA_ContentCredentials = `present (${len} bytes)`
				else if (marker === 0xfe) found.Comment = new TextDecoder().decode(new Uint8Array(buf, o + 4, len - 2))
				else if (marker === 0xe0) found.JFIF = 'present'
				o += 2 + len
			}
			return found
		}

		function readPng(buf) {
			const view = new DataView(buf)
			const found = {}
			let o = 8
			while (o + 8 <= view.byteLength) {
				const len = view.getUint32(o)
				const type = String.fromCharCode(...new Uint8Array(buf, o + 4, 4))
				if (type === 'tEXt' || type === 'iTXt') {
					const raw = new TextDecoder().decode(new Uint8Array(buf, o + 8, len))
					const [k, ...rest] = raw.split('\0')
					found[k || type] = rest.join(' ').trim().slice(0, 200)
				} else if (type === 'zTXt') found.zTXt = 'compressed text chunk'
				else if (type === 'eXIf') found.EXIF = readExif(new DataView(
					(() => { const b = new Uint8Array(len + 6); b.set([69, 120, 105, 102, 0, 0]); b.set(new Uint8Array(buf, o + 8, len), 6); return b.buffer })()), 0)
				else if (type === 'caBX') found.C2PA_ContentCredentials = `present (${len} bytes)`
				else if (type === 'iCCP') found.ICC_Profile = 'present'
				else if (type === 'tIME') found.LastModified = 'present'
				if (type === 'IDAT') break
				o += 12 + len
			}
			return found
		}

		function readWebp(buf) {
			const found = {}
			const dec = new TextDecoder('ascii')
			for (let o = 12; o + 8 <= buf.byteLength;) {
				const id = dec.decode(new Uint8Array(buf, o, 4))
				const len = new DataView(buf).getUint32(o + 4, true)
				if (id === 'EXIF') found.EXIF = 'present (' + len + ' bytes)'
				if (id === 'XMP ') found.XMP = 'present (' + len + ' bytes)'
				if (id === 'ICCP') found.ICC_Profile = 'present (' + len + ' bytes)'
				if (id === 'C2PA') found.C2PA_ContentCredentials = 'present (' + len + ' bytes)'
				o += 8 + len + (len & 1)
			}
			return found
		}

		// Scans the raw file for AI-provenance markers: C2PA / Content Credentials,
		// IPTC "digital source type" flags, and prompt/workflow text written by
		// generators (Stable Diffusion, ComfyUI, Midjourney, DALL-E, Firefly, ...).
		const AI_MARKERS = [
			['C2PA / Content Credentials', /c2pa|jumbf|caBX|contentauth/i],
			['IPTC AI source type', /trainedAlgorithmicMedia|compositeSynthetic|algorithmicMedia|DigitalSourceType/],
			['Generation parameters', /Steps: \d+, Sampler|"class_type"|negative_prompt|"prompt"\s*:|sd-metadata|Dream\0|NovelAI/],
			['Generator name', /Midjourney|DALL[-·\s]?E|Stable Diffusion|ComfyUI|Automatic1111|Adobe Firefly|Imagen|OpenAI|Leonardo\.Ai|Flux|SynthID/i]
		]

		function detectAI(buf) {
			const text = new TextDecoder('latin1').decode(new Uint8Array(buf))
			return AI_MARKERS.filter(([, re]) => re.test(text)).map(([label]) => label)
		}

		function readMetadata(buf, type) {
			try {
				if (type === 'image/jpeg') return readJpeg(buf)
				if (type === 'image/png') return readPng(buf)
				if (type === 'image/webp') return readWebp(buf)
			} catch (e) { return { error: 'Could not parse metadata: ' + e.message } }
			return {}
		}

		/* ---------- 2. STRIP: re-render pixels only ---------- */

		async function stripMetadata(file) {
			// 'from-image' bakes the EXIF rotation into the pixels, so the picture
			// still looks right after the orientation tag is gone.
			const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' })
			const canvas = document.createElement('canvas')
			canvas.width = bitmap.width
			canvas.height = bitmap.height
			canvas.getContext('2d').drawImage(bitmap, 0, 0)
			bitmap.close()

			const type = ['image/jpeg', 'image/png', 'image/webp'].includes(file.type) ? file.type : 'image/png'
			// canvas.toBlob writes a fresh file: no EXIF, XMP, IPTC, text chunks or GPS.
			return new Promise((res, rej) =>
				canvas.toBlob(b => b ? res(b) : rej(new Error('Encoding failed')), type, 0.95))
		}

		/* ---------- 3. DOWNLOAD ---------- */

		function download(blob, originalName) {
			const dot = originalName.lastIndexOf('.')
			const ext = blob.type.split('/')[1].replace('jpeg', 'jpg')
			const base = dot > 0 ? originalName.slice(0, dot) : originalName
			const a = document.createElement('a')
			a.href = URL.createObjectURL(blob)
			a.download = `${base}-clean.${ext}`
			document.body.appendChild(a)
			a.click()
			a.remove()
			setTimeout(() => URL.revokeObjectURL(a.href), 1000)
		}

		/* ---------- UI wiring ---------- */

		const $ = id => document.getElementById(id)
		let current = null

		$('file').addEventListener('change', async e => {
			current = e.target.files[0]
			$('clean').disabled = !current
			$('status').textContent = ''
			if (!current) return

			$('preview').src = URL.createObjectURL(current)
			$('preview').hidden = false

			const buf = await current.arrayBuffer()
			const meta = readMetadata(buf, current.type)
			const ai = detectAI(buf)
			$('meta').textContent =
				(ai.length ? 'Metadados de IA encontrados: ' + ai.join('; ') + '\n\n' : 'Nenhum metadado de IA encontrado.\n\n') +
				(Object.keys(meta).length ? JSON.stringify(meta, null, 2) : 'Nenhum outro metadado encontrado.')
		})

		$('clean').addEventListener('click', async () => {
			if (!current) return
			try {
				const blob = await stripMetadata(current)
				download(blob, current.name)

				// Verify the new file is clean
				const outBuf = await blob.arrayBuffer()
				const after = readMetadata(outBuf, blob.type)
				const aiLeft = detectAI(outBuf)
				$('status').textContent = (Object.keys(after).length || aiLeft.length)
					? 'Baixado. Ainda restou metadado: ' + [...Object.keys(after), ...aiLeft].join(', ')
					: 'Baixado. Todos os metadados foram removidos da imagem.'
			} catch (err) {
				$('status').textContent = 'Error: ' + err.message
			}
		});
	</script>
</body>

</html>
